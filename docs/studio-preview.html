<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoCon Studio · demo pubblica</title><style>body{margin:0;padding:28px;background:#e5ece7;font-family:system-ui,sans-serif}main{max-width:1080px;margin:auto}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-size:13px}select{padding:9px;font:inherit}rocon-studio-card{display:block}@media(max-width:450px){body{padding:12px}}</style></head><body><main><div class="toolbar"><strong>DEMO PUBBLICA · DATI SINTETICI</strong><label>Colori <select id="theme"><option value="solar">Crema e petrolio</option><option value="night">Petrolio e menta</option><option value="ha">Tema Home Assistant</option></select></label><label>Scenario <select id="scenario"><option value="ready">Dati disponibili</option><option value="offline">Sensori non disponibili</option></select></label></div><rocon-studio-card></rocon-studio-card></main>
<script src="../custom_components/rocon_g1_local/frontend/rocon-studio-card.js"></script><script>
const card=document.querySelector('rocon-studio-card'),states={},days=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
function add(id,state,attributes){states[id]={entity_id:id,state:String(state),attributes,last_updated:new Date().toISOString()};}
for(const kind of ['water','direct']){const attr=field=>({source:'rocon_cloud',rocon_gateway:'demo-gateway',rocon_circuit:'demo-'+kind,rocon_index:1,rocon_device:kind,rocon_field:field,controls_enabled:false,last_command_status:'none'});for(let i=1;i<=3;i++)add('number.demo_'+kind+'_profile_'+i,(kind==='water'?[45,48,46]:[20,21,20])[i-1],{...attr('profile_'+i),min:kind==='water'?10:5,max:kind==='water'?70:40,unit_of_measurement:'°C'});for(let p=1;p<=2;p++)for(const day of days)add('text.demo_'+kind+'_program_'+p+'_'+day,p===2?'00:00-00:00;00:00-00:00;00:00-00:00':kind==='water'?'06:00-08:00;13:00-16:00;19:00-20:00':'07:00-22:00;00:00-00:00;00:00-00:00',attr('program_'+p+'_'+day));add('sensor.demo_'+kind+'_command','none',attr('command_status'));}
const attr=(kind,field)=>({source:'rocon_cloud',rocon_gateway:'demo-gateway',rocon_circuit:'demo-'+kind,rocon_device:kind,rocon_field:field,unit_of_measurement:'°C'});
add('sensor.demo_dhw',47.3,attr('water','actualTemperature'));add('sensor.demo_outside',16.2,attr('direct','outsideTemperature'));add('sensor.demo_boiler',39.1,attr('direct','boilerActualTemperature'));
add('number.demo_party',0,{source:'rocon_cloud',rocon_gateway:'demo-gateway',rocon_circuit:'demo-direct',rocon_device:'direct',rocon_field:'party',unit_of_measurement:'min',controls_enabled:false});
for(const [id,value] of [['external',980],['internal',64],['solar',28]])add('sensor.demo_'+id,value,{unit_of_measurement:'W',friendly_name:id==='external'?'Unità esterna':id==='internal'?'Unità interna':'Pompa solare'});
const statistics={},end=Math.floor(Date.now()/3600000)*3600000;for(const [id,multiplier] of [['sensor.demo_external',1],['sensor.demo_internal',.08]]){statistics[id]=Array.from({length:8*24},(_,i)=>{const start=end-(8*24-i)*3600000;return {start,end:start+3600000,mean:(i%24>=11&&i%24<=14?650:70)*multiplier};});}
window.loadCardHelpers=async()=>({createCardElement:config=>{const div=document.createElement('div');div.style.cssText='padding:20px;border:1px dashed #849b90;border-radius:16px;margin:15px 0;line-height:1.7;color:inherit';const h=document.createElement('strong');h.textContent=config.title||'Storico Home Assistant';const p=document.createElement('p');p.textContent='Le letture e i grafici nativi vengono visualizzati qui quando la scheda è installata in Home Assistant. Questa demo non accede a dati reali.';div.append(h,p);return div;}});
const sizeLabel=document.createElement('label');sizeLabel.textContent='Larghezza ';const size=document.createElement('select');size.id='layout-width';for(const [value,text] of [['1080','Adattiva'],['390','Scheda telefono · 390 px'],['600','Scheda tablet · 600 px']]){const option=document.createElement('option');option.value=value;option.textContent=text;size.append(option);}sizeLabel.append(size);document.querySelector('.toolbar').append(sizeLabel);size.addEventListener('change',()=>{document.querySelector('main').style.maxWidth=size.value+'px';});
const config={type:'custom:rocon-studio-card',theme:'solar',demo:true,entities:{power_external:'sensor.demo_external',power_internal:'sensor.demo_internal',power_solar:'sensor.demo_solar'}};
const hass={states,config:{time_zone:'Europe/Rome'},services:{},roconDemoStatistics:statistics};function render(){card.setConfig({...config,theme:document.getElementById('theme').value});const offline=document.getElementById('scenario').value==='offline';card.hass={...hass,states:offline?Object.fromEntries(Object.entries(states).map(([id,s])=>[id,{...s,state:'unavailable'}])):states};}document.getElementById('theme').addEventListener('change',render);document.getElementById('scenario').addEventListener('change',render);render();
</script></body></html>
