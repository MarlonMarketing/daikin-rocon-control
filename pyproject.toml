[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daikin-rocon-local"
version = "0.4.1"
description = "Read-only protocol research tools for Daikin Control and RoCon G1"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
rocon-diagnose = "rocon_local.cli:main"

[tool.setuptools.packages.find]
include = ["rocon_local*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
